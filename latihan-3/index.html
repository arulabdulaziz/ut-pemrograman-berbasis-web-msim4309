<!DOCTYPE html>
<html>
<head>
    <title>Belajar Vue.js</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <p>Angka 1 = <b>{{ angka1 }}</b></p>
        <p>Angka 2 = <b>{{ angka2 }}</b></p>

        <p>Hasil penjumlahan angka 1 dan angka 2 = <b>{{ angka1 + angka2 }}</b></p>
        <p>Hasil pengurangan angka 1 dan angka 2 = <b>{{ angka1 - angka2 }}</b></p>
        <p>Hasil perkalian angka 1 dan angka 2 = <b>{{ angka1 * angka2 }}</b></p>
        <p>Hasil pembagian angka 1 dan angka 2 = <b>{{ angka1 / angka2 }}</b></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script src="apps.js"></script>
</body>
</html>
