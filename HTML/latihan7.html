<!DOCTYPE html>
<html>
<head>
    <title>Latihan HTML</title>
    <link rel="stylesheet" href="../CSS/latihan7.css">
</head>
<body>
    <form>
        <h3>Input Member Baru:</h3>
        <label>Nama:</label>
        <input type="text" name="nama"><br><br>

        <label>Tanggal Lahir:</label>
        <input type="date" name="tanggal"><br><br>

        <label>Tempat Lahir:</label>
        <input type="text" name="tempat"><br><br>

        <label>Jenis Kelamin:</label><br>
        <input type="radio" name="kelamin" value="Pria"> Pria<br>
        <input type="radio" name="kelamin" value="Wanita"> Wanita<br><br>

        <input type="reset" value="Reset">
        <input type="submit" value="Kirim">
    </form>
</body>
</html>
