<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA - Informasi Stok Bahan Ajar</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">
            <h1>SITTA</h1>
        </div>
        <div class="navbar-user">
            <span id="userInfo"></span>
            <button onclick="goToDashboard()" class="btn-secondary">Dashboard</button>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h2>Informasi Stok Bahan Ajar</h2>
            <button onclick="openAddModal()" class="btn-primary">+ Tambah Bahan Ajar</button>
        </div>

        <div class="table-container">
            <table id="stokTable">
                <thead>
                    <tr>
                        <th>Cover</th>
                        <th>Kode Lokasi</th>
                        <th>Kode Barang</th>
                        <th>Nama Barang</th>
                        <th>Jenis</th>
                        <th>Edisi</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="stokTableBody">
                    <!-- Data akan dimuat disini -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Tambah Bahan Ajar -->
    <div id="addModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeAddModal()">&times;</span>
            <h2>Tambah Bahan Ajar Baru</h2>
            <form id="addStokForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="kodeLokasi">Kode Lokasi</label>
                        <input type="text" id="kodeLokasi" placeholder="Contoh: 0JKT01" required>
                    </div>
                    <div class="form-group">
                        <label for="kodeBarang">Kode Barang</label>
                        <input type="text" id="kodeBarang" placeholder="Contoh: EKMA4216" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="namaBarang">Nama Barang</label>
                    <input type="text" id="namaBarang" placeholder="Masukkan nama barang" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="jenisBarang">Jenis Barang</label>
                        <select id="jenisBarang" required>
                            <option value="">Pilih Jenis</option>
                            <option value="BMP">BMP</option>
                            <option value="Non-BMP">Non-BMP</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edisi">Edisi</label>
                        <input type="number" id="edisi" placeholder="1" required>
                    </div>
                    <div class="form-group">
                        <label for="stok">Stok</label>
                        <input type="number" id="stok" placeholder="0" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="cover">URL Cover</label>
                    <input type="text" id="cover" placeholder="img/nama_file.jpg" required>
                </div>
                
                <button type="submit" class="btn-primary">Tambah Bahan Ajar</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/stok.js"></script>
</body>
</html>
