<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA - Tracking Pengiriman</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-brand">
            <h1>SITTA</h1>
        </div>
        <div class="navbar-user">
            <span id="userInfo"></span>
            <button onclick="goToDashboard()" class="btn-secondary">Dashboard</button>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h2>Tracking Pengiriman</h2>
            <p>Lacak status pengiriman bahan ajar Anda</p>
        </div>

        <div class="tracking-search">
            <form id="trackingForm">
                <div class="search-group">
                    <input type="text" id="nomorDO" placeholder="Masukkan Nomor Delivery Order" required>
                    <button type="submit" class="btn-primary">Cari</button>
                </div>
            </form>
        </div>

        <div id="trackingResult" class="tracking-result" style="display: none;">
            <div class="tracking-info-card">
                <div class="info-row">
                    <div class="info-label">Nomor DO:</div>
                    <div class="info-value" id="resultNomorDO"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">Nama Penerima:</div>
                    <div class="info-value" id="resultNama"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">Status:</div>
                    <div class="info-value status" id="resultStatus"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">Ekspedisi:</div>
                    <div class="info-value" id="resultEkspedisi"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">Tanggal Kirim:</div>
                    <div class="info-value" id="resultTanggal"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">Jenis Paket:</div>
                    <div class="info-value" id="resultPaket"></div>
                </div>
                <div class="info-row">
                    <div class="info-label">Total Pembayaran:</div>
                    <div class="info-value" id="resultTotal"></div>
                </div>
            </div>

            <div class="progress-container">
                <h3>Status Pengiriman</h3>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div class="progress-labels">
                    <span>Diterima</span>
                    <span>Dalam Proses</span>
                    <span>Dikirim</span>
                    <span>Selesai</span>
                </div>
            </div>

            <div class="tracking-timeline">
                <h3>Riwayat Perjalanan</h3>
                <div id="timelineContainer" class="timeline"></div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/tracking.js"></script>
</body>
</html>
