<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Data Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="container">
        <h1>Daftar Mahasiswa</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>NIM</th>
                    <th>Email</th>
                    <th>Prodi</th>
                    <th>Fakultas</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="mhs in mahasiswa" :key="mhs.id">
                    <td>{{ mhs.id }}</td>
                    <td>{{ mhs.nama }}</td>
                    <td>{{ mhs.nim }}</td>
                    <td>{{ mhs.email }}</td>
                    <td>{{ mhs.prodi }}</td>
                    <td>{{ mhs.fakultas }}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script src="app.js"></script>
</body>
</html>
