<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITTA - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>SITTA</h1>
                <p class="subtitle">Sistem Informasi Tiras dan Transaksi Bahan Ajar</p>
                <h2>Selamat Datang</h2>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Masukkan email Anda" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password Anda" required>
                </div>
                
                <button type="submit" class="btn-primary">Login</button>
                
                <div class="form-links">
                    <a href="#" id="lupaPasswordLink">Lupa Password?</a>
                    <span>|</span>
                    <a href="#" id="daftarLink">Daftar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Lupa Password -->
    <div id="lupaPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="lupaPasswordModal">&times;</span>
            <h2>Lupa Password</h2>
            <form id="lupaPasswordForm">
                <div class="form-group">
                    <label for="emailReset">Email Terdaftar</label>
                    <input type="email" id="emailReset" placeholder="Masukkan email Anda" required>
                </div>
                <button type="submit" class="btn-primary">Kirim Link Reset</button>
            </form>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="daftarModal" class="modal">
        <div class="modal-content">
            <span class="close" data-modal="daftarModal">&times;</span>
            <h2>Daftar Akun Baru</h2>
            <form id="daftarForm">
                <div class="form-group">
                    <label for="namaDaftar">Nama Lengkap</label>
                    <input type="text" id="namaDaftar" placeholder="Masukkan nama lengkap" required>
                </div>
                <div class="form-group">
                    <label for="emailDaftar">Email</label>
                    <input type="email" id="emailDaftar" placeholder="Masukkan email" required>
                </div>
                <div class="form-group">
                    <label for="passwordDaftar">Password</label>
                    <input type="password" id="passwordDaftar" placeholder="Masukkan password" required>
                </div>
                <div class="form-group">
                    <label for="roleDaftar">Role</label>
                    <select id="roleDaftar" required>
                        <option value="">Pilih Role</option>
                        <option value="UPBJJ-UT">UPBJJ-UT</option>
                        <option value="Puslaba">Puslaba</option>
                        <option value="Fakultas">Fakultas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="lokasiDaftar">Lokasi</label>
                    <input type="text" id="lokasiDaftar" placeholder="Masukkan lokasi" required>
                </div>
                <button type="submit" class="btn-primary">Daftar</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
